<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Rainy Day Reels</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <button class="menu-btn" aria-label="Open menu" type="button">
        <span></span><span></span><span></span>
      </button>
      <nav class="menu" aria-label="Main navigation">
        <ul>
          <li><a href="index.html#home">Home</a></li>
          <li><a href="index.html#about">About Me</a></li>
          <li><a href="portfolio.html">Portfolio</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="content-page contact-page">
    <div class="contact-shell">
      <header class="contact-header">
        <h1>Contact</h1>
      </header>

      <!-- Layout only for now: the form doesn't send yet (to be wired up once the domain is set up). -->
      <form class="contact-form" id="quote-form" aria-label="Quote request form">
        <div class="form-field">
          <label for="cf-name">Name <span class="req" aria-hidden="true">*</span></label>
          <input id="cf-name" name="name" type="text" autocomplete="name" required />
        </div>

        <div class="form-field">
          <label for="cf-email">Email <span class="req" aria-hidden="true">*</span></label>
          <input id="cf-email" name="email" type="email" autocomplete="email" required />
        </div>

        <div class="form-field">
          <label for="cf-phone">Phone <span class="opt">(optional)</span></label>
          <input id="cf-phone" name="phone" type="tel" autocomplete="tel" />
        </div>

        <div class="form-field">
          <label for="cf-type">Request type <span class="req" aria-hidden="true">*</span></label>
          <select id="cf-type" name="request_type" required>
            <option value="" disabled selected>Choose one…</option>
            <option>Commercial / Branded</option>
            <option>Documentary</option>
            <option>Editing / Post-production only</option>
            <option>Event</option>
            <option>Interview</option>
            <option>Music Video</option>
            <option>Performance</option>
            <option>Real Estate</option>
            <option>Wedding</option>
            <hr />
            <option>Other</option>
          </select>
        </div>

        <div class="form-field">
          <label for="cf-date">Date or deadline <span class="opt">(optional)</span></label>
          <input id="cf-date" name="date" type="date" />
          <label class="form-check">
            <input type="checkbox" name="date_flexible" /> My date is flexible
          </label>
        </div>

        <div class="form-field">
          <label for="cf-hours">Estimated hours <span class="opt">(optional)</span></label>
          <input id="cf-hours" name="estimated_hours" type="number" min="0" step="0.5" inputmode="decimal" placeholder="e.g. 4" />
        </div>

        <div class="form-field">
          <label for="cf-location">Location <span class="opt">(optional)</span></label>
          <input id="cf-location" name="location" type="text" placeholder="City or venue" />
        </div>

        <div class="form-field">
          <label for="cf-budget">Budget range <span class="opt">(optional)</span></label>
          <select id="cf-budget" name="budget">
            <option value="" selected>Choose one…</option>
            <option>Under $500</option>
            <option>$500–1,500</option>
            <option>$1,500–5,000</option>
            <option>$5,000+</option>
            <option>Not sure yet</option>
          </select>
        </div>

        <div class="form-field form-field--full">
          <label for="cf-details">Project details <span class="req" aria-hidden="true">*</span></label>
          <textarea id="cf-details" name="details" rows="6" required placeholder="Tell me about your project, plus links to any reference videos."></textarea>
        </div>

        <div class="form-actions form-field--full">
          <p class="form-note"><span class="req" aria-hidden="true">*</span> Required</p>
          <button type="submit" class="form-submit">Send request</button>
        </div>

        <p class="form-status form-field--full" id="form-status" role="status" aria-live="polite"></p>
      </form>

      <p class="home-back-link contact-back"><a href="index.html#home">Home →</a></p>
    </div>
  </main>

  <footer class="site-footer">
    <p>© <span id="year"></span> Venus Eyes — built with Cloudflare Pages.</p>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // Layout preview only: the form doesn't send anything yet.
    document.getElementById('quote-form').addEventListener('submit', (e) => {
      e.preventDefault();
      document.getElementById('form-status').textContent =
        'This form isn’t active yet. Please email mcbjjm@gmail.com for now.';
    });
  </script>
</body>
</html>

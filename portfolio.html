  <!-- Viewer: opens over the page when a tile is clicked. -->

    <button type="button" class="work-viewer__close" aria-label="Close">&#10005;</button>

  <footer class="site-footer">

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    (() => {
      const wall = document.querySelector('.work-wall');
      const items = [...wall.querySelectorAll('.work-item')];
      const filters = [...document.querySelectorAll('.work-filter')];
      const viewer = document.querySelector('.work-viewer');
      const stage = viewer.querySelector('.work-viewer__stage');
      const caption = viewer.querySelector('.work-viewer__caption');
      const threeCols = window.matchMedia('(min-width: 901px)');
      let current = 0;
      let opener = null;

      // What each tile looks like: its rank, shape (from the image's width/height) and main group.
      const info = new Map(items.map((el) => {
        const img = el.querySelector('img');
        const ratio = Number(img.getAttribute('height')) / Number(img.getAttribute('width'));
        const kind = el.querySelector('.work-tile').dataset.kind;
        const shape = ratio > 1.2 ? 'tall' : ratio > 0.8 ? 'square' : kind === 'youtube' ? 'video' : 'wide-photo';
        return [el, { rank: Number(el.dataset.rank) || 3, ratio, shape, group: el.dataset.groups.split(' ')[0] }];
      }));

      // Order: highest rank first, shuffled a little on every visit, and nudged so the same
      // shape or the same group doesn't come up twice in a row (keeps the wall from looking stiff).
      function arrange(list) {
        const pool = list.map((el) => ({ el, ...info.get(el), jitter: Math.random() * 0.9 }));
        const out = [];
        while (pool.length) {
          const prev = out[out.length - 1];
          const prev2 = out[out.length - 2];
          let best = 0;
          let bestScore = -Infinity;
          pool.forEach((p, i) => {
            let score = p.rank + p.jitter;
            if (prev && prev.shape === p.shape) score -= 0.8;
            if (prev2 && prev2.shape === p.shape) score -= 0.4;
            if (prev && prev.group === p.group) score -= 0.7;
            if (score > bestScore) { bestScore = score; best = i; }
          });
          out.push(pool.splice(best, 1)[0]);
        }
        return out.map((p) => p.el);
      }

      const order = arrange(items);

      // Masonry: place tiles in that order, each into the currently shortest column,
      // so the wall reads across and the top row holds the highest-ranked work.
      function layout() {
        const n = threeCols.matches ? 3 : 2;
        const cols = Array.from({ length: n }, () => {
          const col = document.createElement('div');
          col.className = 'work-col';
          return col;
        });
        const heights = new Array(n).fill(0);
        order.forEach((el) => {
          if (el.hidden) { cols[0].append(el); return; }
          const i = heights.indexOf(Math.min(...heights));
          cols[i].append(el);
          heights[i] += info.get(el).ratio + 0.06; // 0.06 ≈ the gap between tiles
        });
        wall.replaceChildren(...cols);
        wall.classList.add('is-masonry');
      }

      layout();
      threeCols.addEventListener('change', layout);

      // Filters: show items whose data-groups contains the chosen filter, then re-pack the columns.
      filters.forEach((btn) => {
        btn.addEventListener('click', () => {
          const f = btn.dataset.filter;
          filters.forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
          items.forEach((el) => {
            el.hidden = f !== 'all' && !el.dataset.groups.split(' ').includes(f);
          });
          layout();
        });
      });

      const visibleTiles = () => order.filter((el) => !el.hidden).map((el) => el.querySelector('.work-tile'));

      function show(tile) {
        stage.textContent = '';
        if (tile.dataset.kind === 'youtube') {
          const frame = document.createElement('iframe');
          frame.src = `https://www.youtube-nocookie.com/embed/${tile.dataset.src}?autoplay=1&rel=0&playsinline=1`;
          frame.title = tile.dataset.title;
          frame.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
          frame.allowFullscreen = true;
          stage.append(frame);
          caption.textContent = tile.dataset.title;
        } else {
          const img = document.createElement('img');
          img.src = tile.dataset.src;
          img.alt = tile.dataset.alt || '';
          stage.append(img);
          caption.textContent = tile.dataset.title || '';
        }
      }

      function step(dir) {
        const tiles = visibleTiles();
        if (!tiles.length) return;
        current = (current + dir + tiles.length) % tiles.length;
        show(tiles[current]);
      }

      document.querySelectorAll('.work-tile').forEach((tile) => {
        tile.addEventListener('click', () => {
          opener = tile;
          current = visibleTiles().indexOf(tile);
          show(tile);
          viewer.showModal();
        });
      });

      viewer.querySelector('.work-viewer__prev').addEventListener('click', () => step(-1));
      viewer.querySelector('.work-viewer__next').addEventListener('click', () => step(1));
      viewer.querySelector('.work-viewer__close').addEventListener('click', () => viewer.close());
      // Click on the dark area around the picture closes the viewer.
      viewer.addEventListener('click', (e) => {
        if (e.target === viewer || e.target.classList.contains('work-viewer__frame') || e.target === stage) viewer.close();
      });
      viewer.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') step(-1);
        if (e.key === 'ArrowRight') step(1);
      });
      // Esc or ✕: stop the video and return focus to the tile.
      viewer.addEventListener('close', () => {
        stage.textContent = '';
        caption.textContent = '';
        if (opener) opener.focus();
      });
    })();
  </script>
